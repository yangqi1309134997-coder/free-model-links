<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <link rel="stylesheet" type="text/css" href="/assets/static/admin/css/bootstrap.min.css"/>
    <link rel="stylesheet" type="text/css" href="/assets/static/plugin/jquery-confirm/jquery-confirm.min.css"/>
    <link rel="stylesheet" type="text/css" href="/assets/static/admin/css/style.min.css"/>
</head>
<body>
<div class="container-fluid p-t-15">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-toolbar d-flex flex-column flex-md-row justify-content-between">
                    <div class="toolbar-btn-action">
                        <select class="form-control" id="filter-site" style="width:200px;display:inline-block">
                            <option value="">全部网站</option>
                        </select>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered" id="ratingTable">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>网站</th>
                                <th>访客ID</th>
                                <th>评分</th>
                                <th>创建时间</th>
                                <th style="text-align:center">操作</th>
                            </tr>
                            </thead>
                            <tbody class="tbody"></tbody>
                        </table>
                    </div>
                    <nav><ul class="pagination justify-content-center" id="pagination"></ul></nav>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="/assets/static/admin/js/jquery.min.js"></script>
<script type="text/javascript" src="/assets/static/admin/js/httpclient.js"></script>
<script type="text/javascript" src="/assets/static/plugin/jquery-confirm/jquery-confirm.min.js"></script>
<script>
var page = 1, pageSize = 20;
function loadRatings() {
    var siteId = $('#filter-site').val();
    var params = 'page=' + page + '&page_size=' + pageSize;
    if (siteId) params += '&site_id=' + siteId;
    AjaxForm('GET', '/api/admin/ratings?' + params, '', function(){}, function(d) {
        var html = '';
        (d.list||[]).forEach(function(r) {
            var stars = '';
            for(var i=1;i<=5;i++) stars += i<=r.score?'★':'☆';
            html += '<tr><td>'+r.id+'</td><td>'+escapeHtml(r.site_title)+'</td><td>'+escapeHtml(r.visitor_id||'-')+'</td>';
            html += '<td><span style="color:#f5a623">'+stars+'</span> '+r.score+'</td><td>'+escapeHtml(r.created_at)+'</td>';
            html += '<td style="text-align:center">';
            html += '<button class="btn btn-sm btn-warning m-r-5" onclick="editRating('+r.id+','+r.score+')">编辑</button>';
            html += '<button class="btn btn-sm btn-danger" onclick="deleteRating('+r.id+')">删除</button>';
            html += '</td></tr>';
        });
        $('.tbody').html(html || '<tr><td colspan="6" class="text-center">暂无数据</td></tr>');
        renderPagination(d.pagination);
    }, function(e){ AjaxError(e); });
}
function escapeHtml(t){if(!t)return'';return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function editRating(id, score) {
    var newScore = prompt('输入新评分 (1-5):', score);
    if (!newScore || newScore<1 || newScore>5) return;
    AjaxPostJson('/api/admin/ratings/'+id, {score:parseInt(newScore)}, function(){}, function(d){
        $.alert({title:'成功',type:'green',content:'评分已更新'});
        loadRatings();
    }, function(e){ AjaxError(e); });
}
function deleteRating(id) {
    $.confirm({title:'确认',content:'确定删除该评分?',type:'red',buttons:{confirm:function(){
        AjaxForm('DELETE','/api/admin/ratings/'+id,'',function(){},function(d){
            $.alert({title:'成功',type:'green',content:'已删除'});
            loadRatings();
        },function(e){AjaxError(e);});
    },cancel:function(){}}});
}
function renderPagination(p) {
    if (!p) return;
    var total = Math.ceil(p.total / p.per_page_count);
    var html = '';
    for (var i=1;i<=total;i++) html += '<li class="page-item'+(i===p.current_page?' active':'')+'"><a class="page-link" href="javascript:void(0)" onclick="page='+i+';loadRatings()">'+i+'</a></li>';
    $('#pagination').html(html);
}
$(function(){ loadRatings(); });
</script>
</body>
</html>
