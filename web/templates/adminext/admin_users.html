<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <link rel="stylesheet" type="text/css" href="/assets/static/admin/css/bootstrap.min.css"/>
    <link rel="stylesheet" type="text/css" href="/assets/static/plugin/jquery-confirm/jquery-confirm.min.css"/>
    <link rel="stylesheet" type="text/css" href="/assets/static/admin/css/style.min.css"/>
</head>
<body>
<div class="container-fluid p-t-15">
    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-toolbar d-flex flex-column flex-md-row justify-content-between">
                    <div class="toolbar-btn-action">
                        <button class="btn btn-primary" onclick="showAdd()"><i class="mdi mdi-plus"></i> 新增用户</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-bordered">
                            <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th style="text-align:center">操作</th></tr></thead>
                            <tbody class="tbody"></tbody>
                        </table>
                    </div>
                    <nav><ul class="pagination justify-content-center" id="pagination"></ul></nav>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/javascript" src="/assets/static/admin/js/jquery.min.js"></script>
<script type="text/javascript" src="/assets/static/admin/js/httpclient.js"></script>
<script type="text/javascript" src="/assets/static/plugin/jquery-confirm/jquery-confirm.min.js"></script>
<script>
var page = 1;
function loadUsers() {
    AjaxForm('GET','/api/admin/users?page='+page+'&page_size=20','',function(){},function(d){
        var html='';
        (d.list||[]).forEach(function(u){
            var badge=u.status==='active'?'badge-success':'badge-danger';
            var statusText=u.status==='active'?'正常':'禁用';
            var roleText=u.role==='admin'?'管理员':'普通用户';
            html+='<tr><td>'+u.id+'</td><td>'+escapeHtml(u.username)+'</td>';
            html+='<td><span class="badge '+(u.role==='admin'?'badge-primary':'badge-info')+'">'+roleText+'</span></td>';
            html+='<td><span class="badge '+badge+'">'+statusText+'</span></td>';
            html+='<td style="text-align:center">';
            if(u.id===1){ html+='<span class="text-muted">超级管理员</span>'; }
            else {
                if(u.status==='active') html+='<button class="btn btn-sm btn-danger" onclick="toggleStatus('+u.id+',\'banned\')">禁用</button>';
                else html+='<button class="btn btn-sm btn-success" onclick="toggleStatus('+u.id+',\'active\')">启用</button>';
            }
            html+='</td></tr>';
        });
        $('.tbody').html(html||'<tr><td colspan="5" class="text-center">暂无数据</td></tr>');
        renderPagination(d.pagination);
    },function(e){AjaxError(e);});
}
function toggleStatus(id,status){
    AjaxPostJson('/api/admin/users/'+id,{status:status},function(){},function(d){
        $.alert({title:'成功',type:'green',content:'操作成功'});loadUsers();
    },function(e){AjaxError(e);});
}
function showAdd(){
    $.confirm({title:'新增用户',content:
        '<div class="form-group"><label>用户名</label><input class="form-control" id="u-username" required></div>'+
        '<div class="form-group"><label>密码</label><input class="form-control" id="u-password" type="password" required></div>'+
        '<div class="form-group"><label>角色</label><select class="form-control" id="u-role"><option value="user">普通用户</option><option value="admin">管理员</option></select></div>'+
        '<div class="form-group"><label>状态</label><select class="form-control" id="u-status"><option value="active">正常</option><option value="banned">禁用</option></select></div>',
    buttons:{confirm:function(){
        var username=$('#u-username').val().trim();
        var password=$('#u-password').val();
        if(!username){$.alert({title:'提示',type:'orange',content:'请输入用户名'});return false}
        if(password.length<6){$.alert({title:'提示',type:'orange',content:'密码至少 6 位'});return false}
        var data={username:username,password:password,role:$('#u-role').val(),status:$('#u-status').val()};
        AjaxPostJson('/api/admin/users',data,function(){},function(d){
            $.alert({title:'成功',type:'green',content:'用户已创建'});loadUsers();
        },function(e){AjaxError(e);});
    },cancel:function(){}}});
}
function escapeHtml(t){if(!t)return'';return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function renderPagination(p){if(!p)return;var total=Math.ceil(p.total/p.per_page_count);var html='';for(var i=1;i<=total;i++)html+='<li class="page-item'+(i===p.current_page?' active':'')+'"><a class="page-link" href="javascript:void(0)" onclick="page='+i+';loadUsers()">'+i+'</a></li>';$('#pagination').html(html);}
$(function(){loadUsers();});
</script>
</body>
</html>
